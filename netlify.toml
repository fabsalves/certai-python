[build]
  base = "frontend"
  command = "npm run build"
  publish = "dist"

# Troque a URL abaixo pela URL real do app Heroku (ex.: certai-api.herokuapp.com)
[[redirects]]
  from = "/api/*"
  to = "https://SUBSTITUA-PELO-APP-HEROKU.herokuapp.com/api/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
